<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飲食店特化の求人サイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7EF;--card:#fff;--ink:#3a3330;--mute:#8a7f78;--line:#eee6da;--coral:#F4766B;--green:#4FBF6F;--blue:#4A9BEE;--pink:#FDE3E1;--cream:#FBE9CF;--mint:#DDF3E3;--sky:#DCEBFB;--yel:#FFD84D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241f1c;--card:#322b27;--ink:#f3ece4;--mute:#b5a99e;--line:#463d37;--pink:#4a2d2b;--cream:#4a3d2a;--mint:#26402f;--sky:#27384c}}
:root[data-theme="dark"]{--bg:#241f1c;--card:#322b27;--ink:#f3ece4;--mute:#b5a99e;--line:#463d37;--pink:#4a2d2b;--cream:#4a3d2a;--mint:#26402f;--sky:#27384c}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;line-height:1.6}
.w{max-width:520px;margin:0 auto;padding:0 18px}
.hero{position:relative;padding:34px 0 10px;overflow:hidden}
.hero:before{content:"";position:absolute;left:-60px;top:-60px;width:180px;height:180px;background:#bfe3f7;border-radius:50%;opacity:.6}
.hero .cp{font-size:26px;font-weight:900;line-height:1.35;transform:rotate(-4deg);position:relative;margin:6px 0 0;color:#6b5d52}
.hero .ph{width:62%;margin-left:auto;margin-top:-70px;border-radius:28px 28px 0 80px;display:block;aspect-ratio:1/1.25;object-fit:cover;object-position:50% 15%}
.ttl{background:var(--card);margin:-48px 0 0;position:relative;padding:14px 16px;border-radius:22px;box-shadow:0 6px 24px #0001;transform:rotate(-3deg)}
.ttl b{display:block;font-size:34px;font-weight:900;line-height:1.15;color:var(--coral)}.ttl b span{color:var(--ink)}
.ttl p{margin:6px 0 0;font-weight:700;font-size:14px;background:linear-gradient(transparent 70%,var(--yel) 70%);display:inline}
.ok{display:flex;gap:10px;justify-content:center;margin:34px 0 8px}
.ok div{width:30%;aspect-ratio:1;border-radius:50%;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:17px;line-height:1.2}.ok small{font-size:12px}
h2{font-size:21px;font-weight:900;text-align:center;margin:44px 0 6px;background:linear-gradient(transparent 68%,var(--yel) 68%);display:inline-block;transform:rotate(-2deg)}
.c{text-align:center}.sub{text-align:center;color:var(--mute);font-size:13px;margin:0 0 18px}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.rec div{border-radius:18px;overflow:hidden;font-weight:700;font-size:13px;text-align:center}.rec img{width:100%;aspect-ratio:1.45;object-fit:cover;display:block}.rec p{margin:0;padding:12px 6px;border-radius:18px 18px 0 0;margin-top:-14px;position:relative}
.panel{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 4px 18px #0000000d}
.panel label,.f label{font-size:12px;font-weight:700;color:var(--mute);display:block;margin:10px 0 4px}
input,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--coral)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{margin:0;display:inline-flex}
.chips input{display:none}.chips span{padding:7px 12px;border-radius:99px;border:2px solid var(--line);font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
.chips input:checked+span{background:var(--coral);border-color:var(--coral);color:#fff}
.rs{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px;font-weight:700}.rs button{background:none;border:0;color:var(--coral);font:inherit;font-weight:700;cursor:pointer}
.card{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 6px 22px #00000012;margin-bottom:22px}
.im{position:relative;aspect-ratio:1.6;background:linear-gradient(135deg,var(--pink),var(--cream));display:flex;align-items:center;justify-content:center;font-size:54px}.im img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.tag{position:absolute;left:12px;top:12px;color:#fff;font-weight:700;font-size:13px;padding:4px 14px;border-radius:99px}
.cm{position:absolute;right:12px;top:14px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 4px #000a;text-align:right;max-width:45%}
.bd{padding:14px 18px 18px}.bd h3{margin:0;font-size:20px}.bd h3 small{font-size:12px;font-weight:500;color:var(--mute)}.bd .k{color:#d99a5b;font-size:12px;margin-bottom:6px}
.r{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;align-items:flex-start}.r i{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center}.r em{font-style:normal;color:var(--mute);flex:none;width:52px;font-size:12px}.r span{flex:1}.r .w2{font-size:15px;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:99px;color:#fff;font:inherit;font-weight:900;font-size:16px;padding:13px;margin-top:10px;cursor:pointer;box-shadow:0 4px 0 #0002}
.coral{background:var(--coral)}.green{background:var(--green)}.blue{background:var(--blue)}
.none{text-align:center;padding:40px 10px;color:var(--mute)}
.ft{margin:30px -18px 0;background:var(--coral);color:#fff;text-align:center;padding:34px 18px 40px;border-radius:50% 50% 0 0/26px 26px 0 0;font-weight:700}
.ft a{display:inline-block;background:#fff;color:var(--coral);border-radius:99px;padding:12px 28px;font-weight:900;text-decoration:none;margin-top:10px}
.rv{opacity:0;transform:translateY(22px);transition:.6s}.rv.on{opacity:1;transform:none}
.ov{position:fixed;inset:0;background:#000a;display:none;z-index:50;align-items:flex-end;justify-content:center}.ov.open{display:flex}
.sh{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .3s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.x{position:sticky;top:0;float:right;margin:10px;width:36px;height:36px;border-radius:50%;border:0;background:#fffd;color:#333;font-size:20px;z-index:2;cursor:pointer}
.in{padding:0 20px}.in h3{font-size:22px;margin:16px 0 2px}.in p{font-size:14px}
.done{text-align:center;padding:40px 24px}.done .e{font-size:60px}.done h3{font-size:22px;color:var(--green)}
.note{font-size:11px;color:var(--mute)}
</style></head><body>
<div class="w">
<section class="hero">
 <p class="cp rv">好きなことで<br>働くって、<br>最高だ。</p>
 <img class="ph rv" src="hero.jpg" alt="">
 <div class="ttl rv"><b>飲食店特化の<span>求人サイト</span></b><p>学生もフリーターも、はじめてのバイトも大歓迎!</p></div>
 <div class="ok rv"><div style="background:var(--coral)">🎓<br>学生<small>OK</small></div><div style="background:var(--green)">🙋<br>フリーター<small>OK</small></div><div style="background:var(--blue)">📖<br>未経験<small>OK</small></div></div>
</section>
<section id="search" class="c"><h2 class="rv">求人を探す</h2><p class="sub">気になる条件で絞り込んでみよう</p>
 <div class="panel rv" style="text-align:left">
  <label for="q" style="margin-top:0">店名で検索</label><input id="q" type="search" placeholder="例:Sunny Cafe / サニー">
  <div class="g2"><div><label for="fa">場所</label><select id="fa"></select></div><div><label for="fc">業種</label><select id="fc"></select></div></div>
  <label for="fw">時給</label><select id="fw"><option value="0">指定なし</option><option>1100</option><option>1200</option><option>1300</option><option>1400</option></select>
  <label>譲れない福利厚生(すべて満たす店のみ)</label><div class="chips" id="fp"></div>
 </div>
 <div class="rs"><span id="cnt"></span><button id="rst">条件をリセット</button></div>
 <div id="list" style="text-align:left"></div>
</section>
<section class="ft rv"><div>食でつながる、最高のバイトライフを。</div><a href="#search">求人を探す →</a></section>
</div>

<div class="ov" id="ov"><div class="sh" id="sh"></div></div>

<script>
// ▼ 求人データ。photo(img)に画像URLかdata:URIを入れるだけで写真を追加できます(空なら絵文字のプレースホルダー)
let JOBS=[
{id:'sunny',name:'Sunny Cafe',kana:'サニーカフェ',cat:'カフェ',sub:'カフェ・スイーツ',role:'ホール・ドリンク',col:'coral',wmin:1200,wmax:1500,area:'中央区',addr:'大阪府大阪市中央区(心斎橋駅 徒歩3分)',perks:['交通費支給','まかないあり','社員割引','制服貸与','シフト相談OK','ネイルOK'],tag:'おしゃれな空間で働ける♪',email:'sunny-cafe@example.com',img:'sunny.jpg',desc:'ラテアートやスイーツ提供をお任せします。未経験でも先輩がていねいにサポート。'},
{id:'bella',name:'Trattoria Bella',kana:'トラットリア ベッラ',cat:'イタリアン',sub:'イタリアン・レストラン',role:'ホール',col:'green',wmin:1150,wmax:1400,area:'北区',addr:'大阪府大阪市北区(梅田駅 徒歩5分)',perks:['交通費支給','まかないあり','制服貸与','社員割引','シフト相談OK','ネイルOK'],tag:'おいしい料理と楽しい仲間と♪',email:'bella@example.com',img:'bella.jpg',desc:'料理の提供・接客がメインです。笑顔で働ける仲間がたくさん!'},
{id:'bistro',name:'Bistro 365',kana:'ビストロ サンロクゴ',cat:'ビストロ・居酒屋',sub:'ビストロ・居酒屋',role:'キッチン',col:'blue',wmin:1100,wmax:1350,area:'福島区',addr:'大阪府大阪市福島区(福島駅 徒歩4分)',perks:['交通費支給','まかないあり','制服貸与','昇給あり','シフト相談OK'],tag:'料理が好きなら最高の環境!',email:'bistro365@example.com',img:'bistro.jpg',desc:'仕込み・調理補助からスタート。料理スキルをしっかり身につけられます。'}];
const EM={'カフェ':'☕','イタリアン':'🍝','ビストロ・居酒屋':'🍷','ラーメン':'🍜'};
const $=s=>document.querySelector(s),yen=n=>n.toLocaleString();
const uniq=k=>[...new Set(JOBS.map(j=>j[k]))];
const PERK_LIST=['交通費支給','まかないあり','制服貸与','社員割引','昇給あり','シフト相談OK','ネイルOK'];
$('#fw').innerHTML=[...$('#fw').options].map(o=>o.value==='0'?o.outerHTML:`<option value="${o.value}">${yen(+o.value)}円以上</option>`).join('');
function buildFilters(){const P=[...new Set([...PERK_LIST,...JOBS.flatMap(j=>j.perks)])];
 $('#fa').innerHTML='<option value="">すべて</option>'+uniq('area').map(a=>`<option>${a}</option>`).join('');
 $('#fc').innerHTML='<option value="">すべて</option>'+uniq('cat').map(a=>`<option>${a}</option>`).join('');
 $('#fp').innerHTML=P.map(p=>`<label><input type="checkbox" value="${p}"><span>${p}</span></label>`).join('')}
const colv=c=>`var(--${c})`;
function render(){
 const q=$('#q').value.trim().toLowerCase(),a=$('#fa').value,c=$('#fc').value,w=+$('#fw').value,ps=[...document.querySelectorAll('#fp input:checked')].map(i=>i.value);
 const r=JOBS.filter(j=>(!q||(j.name+j.kana).toLowerCase().includes(q))&&(!a||j.area===a)&&(!c||j.cat===c)&&j.wmax>=w&&ps.every(p=>j.perks.includes(p)));
 $('#cnt').textContent=r.length+'件の求人';
 $('#list').innerHTML=r.length?r.map(j=>`<article class="card rv on"><div class="im">${j.img?`<img src="${j.img}" alt="${j.name}" loading="lazy" decoding="async">`:EM[j.cat]||'🍽️'}<span class="tag" style="background:${colv(j.col)}">${j.cat}</span>${j.tag?`<span class="cm">${j.tag}</span>`:''}</div><div class="bd"><h3>${j.name} <small>(${j.kana})</small></h3><div class="k">${j.sub}</div>
 <div class="r"><i style="background:var(--coral)">¥</i><em>時給</em><span class="w2">${yen(j.wmin)}円〜${yen(j.wmax)}円</span></div>
 <div class="r"><i style="background:#F5A94B">⌖</i><em>勤務地</em><span>${j.addr}</span></div>
 <div class="r"><i style="background:#F5A94B">★</i><em>福利厚生</em><span>${j.perks.join(' / ')}</span></div>
 <button class="btn ${j.col}" data-id="${j.id}">詳細を見る →</button></div></article>`).join(''):'<div class="none">😢 条件に合う求人が見つかりませんでした。<br>条件を変えてお試しください。</div>';
}
['#q','#fa','#fc','#fw','#fp'].forEach(s=>$(s).addEventListener('input',render));
$('#rst').onclick=()=>{$('#q').value='';$('#fa').value='';$('#fc').value='';$('#fw').value='0';document.querySelectorAll('#fp input').forEach(i=>i.checked=false);render()};
// ▼ 応募の送信先。Formspree等のURLを入れるとメール自動送信、空ならメールアプリを起動
const ENDPOINT='https://formspree.io/f/xwlvdwbn';
const open_=h=>{$('#sh').innerHTML='<button class="x" aria-label="閉じる">×</button>'+h;$('#ov').classList.add('open');$('#sh').scrollTop=0;$('#sh .x').onclick=close_};
const close_=()=>$('#ov').classList.remove('open');
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')close_()});
$('#list').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)detail(JOBS.find(j=>j.id===b.dataset.id))});
function detail(j){
 open_(`<div class="im" style="aspect-ratio:1.6">${j.img?`<img src="${j.img}" alt="">`:EM[j.cat]||'🍽️'}</div><div class="in"><h3>${j.name}</h3><div class="k" style="color:var(--mute);font-size:13px">${j.sub}</div>
 <div class="r"><i style="background:var(--coral)">¥</i><em>時給</em><span class="w2">${yen(j.wmin)}円〜${yen(j.wmax)}円</span></div>
 <div class="r"><i style="background:#F5A94B">⌖</i><em>勤務地</em><span>${j.addr}</span></div>
 <div class="r"><i style="background:#F5A94B">♪</i><em>仕事内容</em><span>${j.role}<br>${j.desc}</span></div>
 <div class="r"><i style="background:#F5A94B">★</i><em>福利厚生</em><span>${j.perks.join(' / ')}</span></div>
 <button class="btn coral" id="ap">この求人に応募する</button></div>`);
 $('#ap').onclick=()=>form(j);
}
function form(j){
 open_(`<div class="in f"><h3>${j.name} に応募</h3><p class="note">以下をご入力ください。応募内容は「${j.name}」宛てにメールで届きます。</p>
 <form id="fm"><label>お名前</label><input name="name" required autocomplete="name" placeholder="例:山田 花子">
 <label>生年月日</label><input name="birth" type="date" required>
 <label>メールアドレス</label><input name="email" type="email" required autocomplete="email" placeholder="example@mail.com">
 <label>電話番号</label><input name="tel" type="tel" required pattern="[0-9\\-]{10,13}" inputmode="tel" placeholder="090-1234-5678">
 <button class="btn coral" type="submit">応募を送信する</button></form></div>`);
 $('#fm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
  const body=`【応募者情報】\nお名前:${d.name}\n生年月日:${d.birth}\nメール:${d.email}\n電話:${d.tel}\n応募先:${j.name}`;
  if(ENDPOINT){try{await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({...d,shop:j.name,_replyto:d.email,_subject:'【応募】'+j.name})})}catch(_){}}
  else location.href=`mailto:${j.email}?subject=${encodeURIComponent('【応募】'+j.name)}&body=${encodeURIComponent(body)}`;
  open_(`<div class="done"><div class="e">🎉</div><h3>応募が完了しました!</h3><p>${j.name} へ応募内容をお送りしました。<br><b>お店からメールまたはお電話で連絡がきます。</b><br>しばらくお待ちください。</p>${ENDPOINT?'':'<p class="note">※デモ版:メールアプリが開いた場合は送信を押してください。</p>'}<button class="btn green" id="cl">閉じる</button></div>`);$('#cl').onclick=close_};
}
const io='IntersectionObserver'in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}}),{threshold:.15}):null;
document.querySelectorAll('.rv').forEach(el=>io?io.observe(el):el.classList.add('on'));
// ▼ Googleスプレッドシート(「ウェブに公開」したCSVのURL)。空のままなら上の店舗データを使います
const SHEET_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQApJ0wPfrM0sB3gAeQ1Nf53FOZ4Jx4JE_LKOW_7t0ZK7xwpbuYmSwwRw94qtNhxe7uk3AjU4gJMQaa/pub?gid=2097025008&single=true&output=csv';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseCSV(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'){row.push(c);r.push(row);row=[];c=''}else if(ch!='\r')c+=ch}if(c||row.length){row.push(c);r.push(row)}return r}
async function loadSheet(){if(!SHEET_URL)return;
 try{const r=await fetch(SHEET_URL,{cache:'no-store'});if(!r.ok)throw 0;
  const rows=parseCSV(await r.text()).filter(a=>a.some(c=>c.trim()));const h=rows.shift().map(s=>s.trim());
  const list=rows.map(a=>{const o={};h.forEach((k,x)=>o[k]=(a[x]||'').trim());return o}).filter(o=>o.name&&!/^(いいえ|no|false|0|非公開)$/i.test(o.show||''));
  if(!list.length)throw 0;
  JOBS=list.map((o,i)=>({id:esc(o.id||'s'+i),name:esc(o.name),kana:esc(o.kana),cat:esc(o.cat),sub:esc(o.sub||o.cat),role:esc(o.role),col:['coral','green','blue'].includes(o.col)?o.col:'coral',wmin:+o.wmin||0,wmax:+o.wmax||+o.wmin||0,area:esc(o.area),addr:esc(o.addr),perks:(o.perks||'').split(/[\/／,、]\s*/).map(s=>esc(s.trim())).filter(Boolean),tag:esc(o.tag),email:esc(o.email),img:esc(o.img),desc:esc(o.desc)}));
  buildFilters();render();dbg(' (シート接続OK)')}catch(e){dbg(' (シート接続失敗:内蔵データを表示中)')}}
function dbg(m){if(location.search.includes('debug'))$('#cnt').textContent+=m}
buildFilters();render();loadSheet();
</script></body></html>
